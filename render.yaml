services:
  - type: web
    name: test01-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DB_PATH
        value: /data/school_bot.db
      - key: PYTHON_VERSION
        value: 3.11.9
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1